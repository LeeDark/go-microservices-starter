syntax = "proto3";

package order;

option go_package = "github.com/LeeDark/go-microservices-starter/books/grpc-microservices-in-go/chapter03/protos/order;orderpb";

service Order {
  rpc Create(CreateOrderRequest) returns (CreateOrderResponse) {}
}

message CreateOrderRequest {
  int32 user_id = 1;
  repeated Item items = 2;
  float total_price = 3;
}

message Item {
  int32 name = 1;
}

message CreateOrderResponse {
  int32 order_id = 1;
}
